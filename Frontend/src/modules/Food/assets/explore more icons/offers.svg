<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="offersBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#FF5E36" />
      <stop offset="100%" stop-color="#FFAE33" />
    </linearGradient>
    <linearGradient id="offersGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="goldTag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D1" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
    <filter id="shadowOffers" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#FF3366" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="15" y="15" width="170" height="170" rx="42" fill="url(#offersBg)" filter="url(#shadowOffers)" />
  
  <!-- Glossy Reflection Sheen -->
  <path d="M 15 57 Q 15 15 57 15 L 143 15 Q 185 15 185 57 L 185 85 Q 100 115 15 85 Z" fill="url(#offersGloss)" />

  <!-- 3D Gift / Offer Tag -->
  <g transform="translate(100, 102) rotate(-12)">
    <rect x="-48" y="-36" width="96" height="72" rx="18" fill="url(#goldTag)" stroke="#FFFFFF" stroke-width="3" filter="url(#shadowOffers)" />
    <!-- Tag Hole -->
    <circle cx="-32" cy="0" r="7" fill="#FF5E36" stroke="#FFFFFF" stroke-width="2" />
    <!-- Percent Symbol -->
    <text x="8" y="16" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="42" fill="#8B0000" text-anchor="middle">%</text>
  </g>

  <!-- Sparkles -->
  <g fill="#FFF" opacity="0.9">
    <path d="M 50 45 Q 50 55 40 55 Q 50 55 50 65 Q 50 55 60 55 Q 50 55 50 45 Z" />
    <path d="M 155 45 Q 155 55 145 55 Q 155 55 155 65 Q 155 55 165 55 Q 155 55 155 45 Z" />
    <path d="M 148 145 Q 148 152 141 152 Q 148 152 148 159 Q 148 152 155 152 Q 148 152 148 145 Z" />
  </g>

  <!-- Small Flame Accent -->
  <path d="M 142 120 C 142 120 152 110 148 95 C 158 105 158 120 152 130 C 148 126 142 120 142 120 Z" fill="#FFE600" />
</svg>